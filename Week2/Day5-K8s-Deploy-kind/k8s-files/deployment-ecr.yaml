apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-ecr-deploy
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-ecr
  template:
    metadata:
      labels:
        app: demo-ecr
    spec:
      containers:
        - name: demo-ecr
          image: 953816747017.dkr.ecr.us-east-1.amazonaws.com/devops-local-app:540b429   # <== This gets replaced using sed
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
      imagePullSecrets:
        - name: ecr-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: demo-ecr-svc
  namespace: demo-app
spec:
  type: NodePort
  selector:
    app: demo-ecr
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080

