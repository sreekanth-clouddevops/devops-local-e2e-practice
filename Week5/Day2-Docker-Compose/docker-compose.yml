version: "3.9"

services:
  web:
    build: .
    container_name: flask-app
    ports:
      - "5001:5000"
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis-db
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
